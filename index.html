<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spaced Repetition Vocab App (Cloud Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入外部單字庫 (請確保 GitHub 上有這個檔案) -->
    <script src="words_data.js"></script>

    <!-- 引入 Firebase 官方套件 (Compat 版，最適合單一 HTML 檔案) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }

        .flip-card {
            background-color: transparent;
            perspective: 1000px;
            width: 100%;
            height: 300px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background-color: white;
            padding: 2rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
        }

        .btn-action { transition: all 0.2s; }
        .btn-action:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        .progress-bar-fill { transition: width 0.3s ease-out; }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .dict-modal-anim { animation: modalFadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導航列 -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center relative z-10">
        <h1 class="text-xl font-bold tracking-wider">VocabMaster</h1>
        
        <div class="flex items-center gap-2">
            <!-- 開發測試按鈕 -->
            <button id="dev-next-day-btn" class="bg-indigo-500 hover:bg-indigo-400 text-xs font-semibold py-1 px-3 rounded-full border border-indigo-300 transition-colors">
                ⏩ +1天
            </button>
            
            <!-- 登入與使用者資訊 -->
            <button id="btn-login" class="bg-white text-indigo-600 hover:bg-indigo-50 text-xs font-bold py-1.5 px-3 rounded-full shadow transition-colors">
                登入存檔
            </button>
            <div id="user-info" class="hidden flex items-center gap-2 bg-indigo-700 py-1 px-2 rounded-full">
                <img id="user-avatar" src="" class="w-6 h-6 rounded-full border border-indigo-300" alt="avatar">
                <button id="btn-logout" class="text-xs text-indigo-100 hover:text-white font-medium px-1">登出</button>
            </div>
        </div>
    </header>

    <!-- 雲端同步提示列 -->
    <div id="sync-banner" class="bg-yellow-100 text-yellow-800 text-xs text-center py-1 hidden">
        目前為訪客模式，進度將不會永久儲存。請登入以啟用雲端同步。
    </div>
    <div id="loading-banner" class="bg-blue-100 text-blue-800 text-xs text-center py-1 hidden">
        正在與雲端同步資料中...
    </div>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative">
        
        <!-- 儀表板視圖 (Dashboard) -->
        <div id="view-dashboard" class="w-full">
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                <h2 class="text-2xl font-bold mb-1">今日學習計畫</h2>
                <p class="text-gray-500 text-sm mb-6" id="current-date-display">虛擬時間: 第 1 天</p>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-blue-50 rounded-xl p-4 text-center border border-blue-100">
                        <p class="text-blue-800 text-sm font-semibold mb-1">待複習</p>
                        <p class="text-3xl font-bold text-blue-600" id="stat-review">0</p>
                    </div>
                    <div class="bg-green-50 rounded-xl p-4 text-center border border-green-100">
                        <p class="text-green-800 text-sm font-semibold mb-1">新單字</p>
                        <p class="text-3xl font-bold text-green-600" id="stat-new">10</p>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-xl p-4 flex justify-between items-center border border-gray-100 mb-6">
                    <div class="text-sm text-gray-600">已掌握詞彙</div>
                    <div class="text-lg font-bold text-gray-800" id="stat-mastered">0 / 1000</div>
                </div>

                <button id="btn-start-session" class="btn-action w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 text-lg flex items-center justify-center gap-2">
                    開始今日課程
                </button>
            </div>
        </div>

        <!-- 學習視圖 (Study Session) -->
        <div id="view-study" class="w-full hidden">
            <!-- 進度條 -->
            <div class="w-full mb-6">
                <div class="flex justify-between text-xs text-gray-500 font-semibold mb-2">
                    <span id="session-progress-text">進度: 0/10</span>
                    <span id="session-queue-type" class="text-indigo-600"></span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="session-progress-bar" class="bg-indigo-600 h-2.5 rounded-full progress-bar-fill" style="width: 0%"></div>
                </div>
            </div>

            <!-- 單字卡 -->
            <div class="flip-card mb-8" id="flashcard">
                <div class="flip-card-inner">
                    <!-- 正面 (英文) -->
                    <div class="flip-card-front">
                        <button id="btn-audio" class="absolute top-4 right-4 p-2 text-gray-400 hover:text-indigo-600 rounded-full hover:bg-indigo-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                        </button>
                        <h2 class="text-5xl font-extrabold text-gray-800 mb-1 tracking-tight break-all" id="card-word">Apple</h2>
                        <p class="text-gray-400 font-mono text-lg mb-4" id="card-kk">/ˈæpəl/</p>
                        <p class="text-gray-400 text-sm mt-4">點擊卡片翻面看解答</p>
                    </div>
                    <!-- 背面 (中文) -->
                    <div class="flip-card-back p-4">
                        <h2 class="text-3xl font-bold text-gray-800 mb-1 break-all" id="card-word-back">Apple</h2>
                        <p class="text-gray-400 font-mono text-sm mb-2" id="card-kk-back">/ˈæpəl/</p>
                        <div class="w-16 h-1 bg-indigo-100 rounded my-1"></div>
                        <p class="text-2xl text-indigo-700 font-semibold mb-4" id="card-translation">蘋果</p>
                        
                        <div id="example-container" class="bg-gray-50 rounded-xl p-4 w-full text-left relative border border-gray-100 mt-2 hidden">
                            <button id="btn-example-audio" class="absolute top-2 right-2 p-1 text-gray-400 hover:text-indigo-600 rounded-full hover:bg-indigo-100 transition-colors z-10" title="朗讀例句">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                            </button>
                            <p class="text-gray-700 font-medium mb-2 pr-8 text-sm leading-relaxed" id="card-example"></p>
                            <p class="text-gray-500 text-xs" id="card-example-zh"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div id="action-show-answer" class="w-full">
                <button class="btn-action w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl shadow-lg text-lg" id="btn-show-answer">顯示解答</button>
            </div>
            <div id="action-rate" class="w-full grid grid-cols-2 gap-4 hidden">
                <button class="btn-action bg-red-100 hover:bg-red-200 text-red-700 border border-red-200 font-bold py-4 rounded-xl shadow-sm text-lg" id="btn-rate-wrong">忘記了 (重來)</button>
                <button class="btn-action bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-sm shadow-green-200 text-lg" id="btn-rate-right">記得了 (過關)</button>
            </div>
        </div>

        <!-- 課程結束視圖 -->
        <div id="view-completed" class="w-full hidden text-center">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">太棒了！</h2>
                <p class="text-gray-500 mb-8">你已經完成了今天的單字課程與錯題複習。進度已自動儲存。</p>
                <button id="btn-return-dash" class="btn-action w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md">返回儀表板</button>
            </div>
        </div>

        <!-- 字典查詢彈出視窗 -->
        <div id="dict-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full relative dict-modal-anim">
                <button id="btn-close-dict" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 rounded-full p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                <div id="dict-content" class="mt-2 min-h-[100px] flex flex-col justify-center"></div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 1. Firebase 雲端設定區 (替換成你的金鑰)
        // ==========================================
        const firebaseConfig = {
		apiKey: "AIzaSyDwtMMyFRdrQm4YTwACi7-i2La9q1Ph4rg",
		authDomain: "githuben-e26eb.firebaseapp.com",
		projectId: "githuben-e26eb",
		storageBucket: "githuben-e26eb.firebasestorage.app",
		messagingSenderId: "686664343620",
		appId: "1:686664343620:web:15f245e8aca0d6323fdc11",
		measurementId: "G-QBVDWPWN8Y"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null; 

        // ==========================================
        // 2. 本地變數與資料庫 (讀取 1000 單字)
        // ==========================================
        const vocabularyDB = typeof externalVocabularyDB !== 'undefined' ? externalVocabularyDB : [
            { id: 1, en: 'error', kk: '', zh: '錯誤', example: 'Please ensure words_data.js is loaded.', exampleZh: '請確保單字庫檔案已正確載入。' }
        ];

        const SRS_INTERVALS = [0, 1, 3, 7, 14, 30]; 
        const MAX_LEVEL = 5;
        const NEW_WORDS_PER_DAY = 10; // 每天學習 10 個新單字

        let virtualCurrentDay = 0;
        let userProgress = {};
        
        let sessionQueue = [];
        let mistakeQueue = [];
        let currentWord = null;
        let isShowingAnswer = false;
        let isMistakeMode = false;
        let totalCardsInSession = 0;
        let cardsCompleted = 0;

        // DOM 元素
        const viewDashboard = document.getElementById('view-dashboard');
        const viewStudy = document.getElementById('view-study');
        const viewCompleted = document.getElementById('view-completed');
        const flashcard = document.getElementById('flashcard');
        const actionShowAnswer = document.getElementById('action-show-answer');
        const actionRate = document.getElementById('action-rate');
        
        // ==========================================
        // 3. 登入與雲端同步邏輯
        // ==========================================
        
        auth.onAuthStateChanged(async (user) => {
            const loginBtn = document.getElementById('btn-login');
            const userInfo = document.getElementById('user-info');
            const syncBanner = document.getElementById('sync-banner');
            const loadingBanner = document.getElementById('loading-banner');
            
            if (user) {
                currentUser = user;
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                syncBanner.classList.add('hidden');
                document.getElementById('user-avatar').src = user.photoURL;
                
                loadingBanner.classList.remove('hidden');
                await loadDataFromCloud();
                loadingBanner.classList.add('hidden');
            } else {
                currentUser = null;
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
                syncBanner.classList.remove('hidden');
                initLocalData();
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            auth.signInWithRedirect(googleProvider).catch(error => {
                if(error.code === 'auth/invalid-api-key' || error.message.includes('API key')) {
                    alert('系統提示：請確認你是否已經貼上正確的 Firebase 金鑰！');
                } else {
                    console.error("登入失敗", error);
                    alert("登入發生錯誤：" + error.message);
                }
            });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            auth.signOut();
        });

        async function loadDataFromCloud() {
            try {
                const docRef = db.collection('users').doc(currentUser.uid);
                const docSnap = await docRef.get();
                
                if (docSnap.exists) {
                    const data = docSnap.data();
                    userProgress = data.progress || {};
                    virtualCurrentDay = data.day || 0;
                } else {
                    userProgress = {};
                    virtualCurrentDay = 0;
                }
                initAppLogic(); 
            } catch (error) {
                console.error("讀取雲端資料失敗:", error);
                alert("讀取雲端資料失敗，將使用本地暫存模式。");
                initLocalData();
            }
        }

        function saveToCloud() {
            if (!currentUser) return; 
            
            db.collection('users').doc(currentUser.uid).set({
                progress: userProgress,
                day: virtualCurrentDay,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(error => {
                console.error("雲端存檔失敗:", error);
            });
        }

        // ==========================================
        // 4. 遊戲核心邏輯
        // ==========================================
        
        function initLocalData() {
            userProgress = {};
            virtualCurrentDay = 0;
            initAppLogic();
        }

        function initAppLogic() {
            updateDashboard();
        }

        function updateDashboard() {
            document.getElementById('current-date-display').innerText = `虛擬時間: 第 ${virtualCurrentDay} 天`;

            let reviewCount = 0, masteredCount = 0;
            let unlearnedWords = [];

            // 計算複習與已掌握
            for (let id in userProgress) {
                const progress = userProgress[id];
                if (progress.level >= MAX_LEVEL) {
                    masteredCount++;
                } else if (progress.isLearning && progress.nextReviewDay <= virtualCurrentDay) {
                    reviewCount++;
                }
            }
            
            // 找新單字 (Lazy Initialization，只要沒有在 userProgress 裡就算新字)
            for (let i = 0; i < vocabularyDB.length; i++) {
                const w = vocabularyDB[i];
                if (!userProgress[w.id] || !userProgress[w.id].isLearning) {
                    if (unlearnedWords.length < NEW_WORDS_PER_DAY) {
                        unlearnedWords.push(w.id);
                    } else {
                        break;
                    }
                }
            }

            const newCount = unlearnedWords.length;
            document.getElementById('stat-review').innerText = reviewCount;
            document.getElementById('stat-new').innerText = newCount;
            document.getElementById('stat-mastered').innerText = `${masteredCount} / ${vocabularyDB.length}`;

            const startBtn = document.getElementById('btn-start-session');
            if (reviewCount === 0 && newCount === 0) {
                startBtn.innerText = "今日任務已完成，明天見！";
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                startBtn.innerText = `開始今日課程 (${reviewCount + newCount} 字)`;
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        document.getElementById('btn-start-session').addEventListener('click', () => {
            sessionQueue = []; mistakeQueue = [];
            let unlearnedWords = [];

            // 找待複習單字
            for (let id in userProgress) {
                const progress = userProgress[id];
                if (progress.isLearning && progress.level < MAX_LEVEL && progress.nextReviewDay <= virtualCurrentDay) {
                    sessionQueue.push(vocabularyDB.find(w => w.id == id));
                }
            }

            // 找新單字
            for (let i = 0; i < vocabularyDB.length; i++) {
                const w = vocabularyDB[i];
                if (!userProgress[w.id] || !userProgress[w.id].isLearning) {
                    if (unlearnedWords.length < NEW_WORDS_PER_DAY) {
                        unlearnedWords.push(w);
                    } else {
                        break;
                    }
                }
            }

            sessionQueue = sessionQueue.concat(unlearnedWords);

            // 正式開始學習時，才將新單字加入 userProgress
            unlearnedWords.forEach(w => { 
                if (!userProgress[w.id]) {
                    userProgress[w.id] = { level: 0, nextReviewDay: 0, isLearning: true };
                } else {
                    userProgress[w.id].isLearning = true; 
                }
            });
            saveToCloud(); 

            // 打亂陣列
            for (let i = sessionQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sessionQueue[i], sessionQueue[j]] = [sessionQueue[j], sessionQueue[i]];
            }

            totalCardsInSession = sessionQueue.length;
            cardsCompleted = 0; isMistakeMode = false;

            viewDashboard.classList.add('hidden');
            viewStudy.classList.remove('hidden');
            nextCard();
        });

        function nextCard() {
            flashcard.classList.remove('flipped');
            actionShowAnswer.classList.remove('hidden');
            actionRate.classList.add('hidden');
            isShowingAnswer = false;

            if (sessionQueue.length > 0) {
                currentWord = sessionQueue.shift();
                document.getElementById('session-queue-type').innerText = "一般課程";
            } else if (mistakeQueue.length > 0) {
                isMistakeMode = true;
                currentWord = mistakeQueue.shift();
                totalCardsInSession = cardsCompleted + mistakeQueue.length + 1;
                document.getElementById('session-queue-type').innerText = "錯題強制複習";
            } else {
                finishSession();
                return;
            }

            document.getElementById('card-word').innerText = currentWord.en;
            document.getElementById('card-word-back').innerText = currentWord.en;
            document.getElementById('card-translation').innerText = currentWord.zh;
            
            const kkText = currentWord.kk || '';
            document.getElementById('card-kk').innerText = kkText;
            document.getElementById('card-kk-back').innerText = kkText;
            
            // 處理例句顯示 (如果有才顯示)
            const exampleContainer = document.getElementById('example-container');
            if(currentWord.example) {
                exampleContainer.classList.remove('hidden');
                document.getElementById('card-example').innerHTML = renderClickableSentence(currentWord.example);
                
                const exampleZhEl = document.getElementById('card-example-zh');
                if (currentWord.exampleZh) {
                    exampleZhEl.innerText = currentWord.exampleZh;
                    exampleZhEl.classList.remove('hidden');
                } else {
                    exampleZhEl.classList.add('hidden');
                }
            } else {
                exampleContainer.classList.add('hidden');
            }

            updateProgressBar();
            playAudio(currentWord.en);
        }

        function handleAnswer(isCorrect) {
            const wordId = currentWord.id;
            let progress = userProgress[wordId];

            if (isMistakeMode) {
                if (isCorrect) {
                    cardsCompleted++;
                    progress.level = 1;
                    progress.nextReviewDay = virtualCurrentDay + SRS_INTERVALS[progress.level];
                } else {
                    mistakeQueue.push(currentWord);
                }
            } else {
                cardsCompleted++;
                if (isCorrect) {
                    progress.level = Math.min(progress.level + 1, MAX_LEVEL);
                    progress.nextReviewDay = virtualCurrentDay + SRS_INTERVALS[progress.level];
                } else {
                    progress.level = Math.max(0, progress.level - 1); // 答錯只降一級，降低挫折感
                    progress.nextReviewDay = virtualCurrentDay;
                    mistakeQueue.push(currentWord);
                }
            }
            
            saveToCloud(); 

            setTimeout(() => { nextCard(); }, 150);
        }

        function updateProgressBar() {
            const percentage = (cardsCompleted / totalCardsInSession) * 100;
            document.getElementById('session-progress-bar').style.width = `${percentage}%`;
            document.getElementById('session-progress-text').innerText = `進度: ${cardsCompleted} / ${totalCardsInSession}`;
        }

        function finishSession() {
            viewStudy.classList.add('hidden');
            viewCompleted.classList.remove('hidden');
        }

        document.getElementById('btn-return-dash').addEventListener('click', () => {
            viewCompleted.classList.add('hidden');
            viewDashboard.classList.remove('hidden');
            updateDashboard();
        });

        document.getElementById('btn-show-answer').addEventListener('click', () => {
            if (isShowingAnswer) return;
            isShowingAnswer = true;
            flashcard.classList.add('flipped');
            actionShowAnswer.classList.add('hidden');
            actionRate.classList.remove('hidden');
        });

        document.getElementById('btn-rate-wrong').addEventListener('click', () => handleAnswer(false));
        document.getElementById('btn-rate-right').addEventListener('click', () => handleAnswer(true));
        
        flashcard.addEventListener('click', (e) => {
            if (!isShowingAnswer && !e.target.closest('button') && !e.target.closest('.dict-word')) {
                document.getElementById('btn-show-answer').click();
            }
        });

        document.getElementById('dev-next-day-btn').addEventListener('click', () => {
            virtualCurrentDay++;
            saveToCloud(); 
            updateDashboard();
            if (!viewCompleted.classList.contains('hidden')) {
                document.getElementById('btn-return-dash').click();
            }
        });

        // ==========================================
        // 5. 語音與字典功能 
        // ==========================================
        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        document.getElementById('btn-audio').addEventListener('click', () => playAudio(currentWord.en));
        document.getElementById('btn-example-audio').addEventListener('click', () => {
            if (currentWord && currentWord.example) playAudio(currentWord.example);
        });

        // 使用事件代理處理例句點擊
        document.getElementById('card-example').addEventListener('click', (e) => {
            const wordSpan = e.target.closest('.dict-word');
            if (wordSpan) {
                e.stopPropagation();
                lookupWord(wordSpan.getAttribute('data-word'));
            }
        });

        function renderClickableSentence(sentence) {
            if (!sentence) return '';
            return sentence.replace(/\b([a-zA-Z]+(?:'[a-zA-Z]+)?)\b/g, (match) => {
                const cleanWord = match.toLowerCase().replace(/['".,!?]/g, ''); 
                return `<span class="dict-word cursor-pointer text-indigo-600 border-b border-dashed border-indigo-300 hover:bg-indigo-100 transition-colors" data-word="${cleanWord}">${match}</span>`;
            });
        }

        async function lookupWord(word) {
            const modal = document.getElementById('dict-modal');
            const content = document.getElementById('dict-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex justify-center py-4"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div></div>`;
            
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (!response.ok) throw new Error('Not found');
                const data = await response.json();
                const entry = data[0];
                
                let phonetic = entry?.phonetic || '';
                if (!phonetic && entry?.phonetics?.length > 0) {
                    const p = entry.phonetics.find(p => p.text);
                    if (p) phonetic = p.text;
                }
                const pos = entry?.meanings?.[0]?.partOfSpeech || '詞性未知';
                const def = entry?.meanings?.[0]?.definitions?.[0]?.definition || '無詳細釋義。';
                
                content.innerHTML = `
                    <h3 class="text-2xl font-bold text-gray-800">${word}</h3>
                    <div class="flex items-center gap-2 mb-3 mt-1">
                        <span class="text-gray-500 font-mono">${phonetic}</span>
                        <button id="btn-dict-audio" class="text-indigo-500 hover:text-indigo-700 p-1">
                            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                    <span class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2 py-1 rounded font-semibold mb-2">${pos}</span>
                    <p class="text-gray-700 text-sm leading-relaxed mb-4">${def}</p>
                    <a href="https://tw.dictionary.search.yahoo.com/search?p=${word}" target="_blank" class="block text-center bg-purple-50 text-purple-700 hover:bg-purple-100 font-semibold py-2 rounded-lg text-sm border border-purple-200">在 Yahoo 字典查看</a>
                `;
                document.getElementById('btn-dict-audio').addEventListener('click', () => playAudio(word));
            } catch (e) {
                content.innerHTML = `
                    <h3 class="text-xl font-bold text-gray-800">${word}</h3>
                    <div class="flex items-center gap-2 mb-3 mt-1">
                        <button id="btn-dict-audio" class="text-indigo-500 hover:text-indigo-700 flex items-center gap-1 text-sm bg-indigo-50 rounded-full px-3 py-1">
                            聆聽發音
                        </button>
                    </div>
                    <p class="text-gray-500 text-sm mt-2 mb-4">目前無法取得英文釋義。</p>
                    <div class="flex flex-col gap-2">
                        <a href="https://tw.dictionary.search.yahoo.com/search?p=${word}" target="_blank" class="text-center bg-purple-50 text-purple-700 hover:bg-purple-100 font-semibold py-2 rounded-lg text-sm border border-purple-200">在 Yahoo 字典查看</a>
                        <a href="https://translate.google.com/?sl=en&tl=zh-TW&text=${word}&op=translate" target="_blank" class="text-center bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold py-2 rounded-lg text-sm border border-indigo-200">使用 Google 翻譯</a>
                    </div>
                `;
                document.getElementById('btn-dict-audio').addEventListener('click', () => playAudio(word));
            }
        }

        document.getElementById('btn-close-dict').addEventListener('click', () => {
            document.getElementById('dict-modal').classList.add('hidden');
        });
        document.getElementById('dict-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('dict-modal')) e.target.classList.add('hidden');
        });

    </script>
</body>
</html>
