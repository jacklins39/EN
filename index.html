<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spaced Repetition Vocab App (Cloud Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- 引入外部單字庫 -->
    <script src="words_data.js"></script>

    <!-- 引入 Firebase 官方套件 (Compat 版，最適合單一 HTML 檔案) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }

        .flip-card {
            background-color: transparent;
            perspective: 1000px;
            width: 100%;
            height: 300px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background-color: white;
            padding: 2rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
        }

        .btn-action { transition: all 0.2s; }
        .btn-action:active { transform: scale(0.95); }
        .hidden { display: none !important; }
        .progress-bar-fill { transition: width 0.3s ease-out; }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .dict-modal-anim { animation: modalFadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導航列 -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center relative z-10">
        <h1 class="text-xl font-bold tracking-wider">VocabMaster</h1>
        
        <div class="flex items-center gap-2">
            <!-- 開發測試按鈕 -->
            <button id="dev-next-day-btn" class="bg-indigo-500 hover:bg-indigo-400 text-xs font-semibold py-1 px-3 rounded-full border border-indigo-300 transition-colors">
                ⏩ +1天
            </button>
            
            <!-- 登入與使用者資訊 -->
            <button id="btn-login" class="bg-white text-indigo-600 hover:bg-indigo-50 text-xs font-bold py-1.5 px-3 rounded-full shadow transition-colors">
                登入存檔
            </button>
            <div id="user-info" class="hidden flex items-center gap-2 bg-indigo-700 py-1 px-2 rounded-full">
                <img id="user-avatar" src="" class="w-6 h-6 rounded-full border border-indigo-300" alt="avatar">
                <button id="btn-logout" class="text-xs text-indigo-100 hover:text-white font-medium px-1">登出</button>
            </div>
        </div>
    </header>

    <!-- 雲端同步提示列 -->
    <div id="sync-banner" class="bg-yellow-100 text-yellow-800 text-xs text-center py-1 hidden">
        目前為訪客模式，進度將不會永久儲存。請登入以啟用雲端同步。
    </div>
    <div id="loading-banner" class="bg-blue-100 text-blue-800 text-xs text-center py-1 hidden">
        正在與雲端同步資料中...
    </div>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative">
        
        <!-- 儀表板視圖 (Dashboard) -->
        <div id="view-dashboard" class="w-full">
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                <h2 class="text-2xl font-bold mb-1">今日學習計畫</h2>
                <div class="flex justify-between items-center mb-6">
                    <p class="text-gray-500 text-sm" id="current-date-display">虛擬時間: 第 1 天</p>
                    <select id="unit-selector" class="bg-indigo-50 border border-indigo-200 text-indigo-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 outline-none">
                        <option value="1">單元 1 (1-1000)</option>
                        <option value="2">單元 2 (1001-2000)</option>
                        <option value="3">單元 3 (2001-3000)</option>
                        <option value="4">單元 4 (3001-4000)</option>
                        <option value="5">單元 5 (4001-5000)</option>
                        <option value="6">單元 6 (5001-6000)</option>
                        <option value="7">單元 7 (6001-7000)</option>
                        <option value="8">單元 8 (7001-8000)</option>
                        <option value="9">單元 9 (8001-8798)</option>
                        <option value="10">單元 10 (自訂字庫)</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-blue-50 rounded-xl p-4 text-center border border-blue-100">
                        <p class="text-blue-800 text-sm font-semibold mb-1">待複習</p>
                        <p class="text-3xl font-bold text-blue-600" id="stat-review">0</p>
                    </div>
                    <div class="bg-green-50 rounded-xl p-4 text-center border border-green-100">
                        <p class="text-green-800 text-sm font-semibold mb-1">新單字</p>
                        <p class="text-3xl font-bold text-green-600" id="stat-new">10</p>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-xl p-4 flex justify-between items-center border border-gray-100 mb-4">
                    <div class="text-sm text-gray-600">已掌握詞彙</div>
                    <div class="text-lg font-bold text-gray-800" id="stat-mastered">0 / 1000</div>
                </div>

                <!-- 練習組距圖示分析 -->
                <div class="mb-6 bg-white border border-gray-100 rounded-xl p-2 shadow-sm">
                    <canvas id="masteryChart" class="w-full h-40"></canvas>
                </div>

                <button id="btn-start-session" class="btn-action w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 text-lg flex items-center justify-center gap-2 mb-4">
                    開始今日課程
                </button>

                <!-- 週/月/年 錯字加強 -->
                <div class="grid grid-cols-3 gap-2">
                    <button id="btn-review-week" class="bg-red-50 text-red-700 p-3 rounded-xl text-sm font-bold border border-red-200 hover:bg-red-100 transition-colors shadow-sm">本週錯題</button>
                    <button id="btn-review-month" class="bg-orange-50 text-orange-700 p-3 rounded-xl text-sm font-bold border border-orange-200 hover:bg-orange-100 transition-colors shadow-sm">本月錯題</button>
                    <button id="btn-review-all" class="bg-yellow-50 text-yellow-700 p-3 rounded-xl text-sm font-bold border border-yellow-200 hover:bg-yellow-100 transition-colors shadow-sm">全部錯題</button>
                </div>
            </div>
        </div>

        <!-- 學習視圖 (Study Session) -->
        <div id="view-study" class="w-full hidden">
            <!-- 進度條 -->
            <div class="w-full mb-6">
                <div class="flex justify-between text-xs text-gray-500 font-semibold mb-2">
                    <span id="session-progress-text">進度: 0/10</span>
                    <span id="session-queue-type" class="text-indigo-600"></span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="session-progress-bar" class="bg-indigo-600 h-2.5 rounded-full progress-bar-fill" style="width: 0%"></div>
                </div>
            </div>

            <!-- 單字卡 -->
            <div class="flip-card mb-8" id="flashcard">
                <div class="flip-card-inner">
                    <!-- 正面 (英文) -->
                    <div class="flip-card-front">
                        <button id="btn-audio" class="absolute top-4 right-4 p-2 text-gray-400 hover:text-indigo-600 rounded-full hover:bg-indigo-50 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                        </button>
                        <h2 class="text-5xl font-extrabold text-gray-800 mb-1 tracking-tight break-all" id="card-word">Apple</h2>
                        <p class="text-gray-400 font-mono text-lg mb-4" id="card-kk">/ˈæpəl/</p>
                        <p class="text-gray-400 text-sm mt-4">點擊卡片翻面看解答</p>
                    </div>
                    <!-- 背面 (中文) -->
                    <div class="flip-card-back p-4">
                        <h2 class="text-3xl font-bold text-gray-800 mb-1 break-all" id="card-word-back">Apple</h2>
                        <p class="text-gray-400 font-mono text-sm mb-2" id="card-kk-back">/ˈæpəl/</p>
                        <div class="w-16 h-1 bg-indigo-100 rounded my-1"></div>
                        <p class="text-2xl text-indigo-700 font-semibold mb-4" id="card-translation">蘋果</p>
                        
                        <div id="example-container" class="bg-indigo-50 rounded-xl p-4 w-full text-left relative border border-indigo-100 mt-2 hidden group cursor-help transition-all duration-300 hover:shadow-md hover:bg-white">
                            <button id="btn-example-audio" class="absolute top-2 right-2 p-1 text-indigo-400 hover:text-indigo-600 rounded-full hover:bg-indigo-100 transition-colors z-10" title="朗讀例句">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                            </button>
                            <div class="text-[10px] text-indigo-400 mb-1 font-bold tracking-widest uppercase">Example 例句 <span class="text-indigo-300 normal-case ml-1 font-normal">(游標移入顯示翻譯)</span></div>
                            <p class="text-gray-700 font-semibold mb-1 pr-8 text-[15px] leading-relaxed" id="card-example"></p>
                            <div class="overflow-hidden transition-all duration-500 max-h-0 opacity-0 group-hover:max-h-[200px] group-hover:opacity-100 group-hover:mt-2 group-hover:pt-2 group-hover:border-t group-hover:border-dashed group-hover:border-indigo-200">
                                <p class="text-indigo-600 text-sm font-medium" id="card-example-zh"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div id="quiz-options" class="w-full grid grid-cols-1 gap-3 hidden">
                <!-- 4選1按鈕 -->
            </div>

            <div id="action-show-answer" class="w-full">
                <button class="btn-action w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-xl shadow-lg text-lg" id="btn-show-answer">顯示解答</button>
            </div>
            
            <div id="action-next" class="w-full hidden mt-4">
                <button class="btn-action w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 text-lg" id="btn-next-card">下一題 ➔</button>
            </div>

            <div id="action-rate" class="w-full grid grid-cols-2 gap-4 hidden mt-4">
                <button class="btn-action bg-red-100 hover:bg-red-200 text-red-700 border border-red-200 font-bold py-4 rounded-xl shadow-sm text-lg" id="btn-rate-wrong">忘記了 (重來)</button>
                <button class="btn-action bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-sm shadow-green-200 text-lg" id="btn-rate-right">記得了 (過關)</button>
            </div>
        </div>

        <!-- 課程結束視圖 -->
        <div id="view-completed" class="w-full hidden text-center">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">太棒了！</h2>
                <p class="text-gray-500 mb-8">你已經完成了今天的單字課程與錯題複習。進度已自動儲存。</p>
                <button id="btn-return-dash" class="btn-action w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md">返回儀表板</button>
            </div>
        </div>

        <!-- 字典查詢彈出視窗 -->
        <div id="dict-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full relative dict-modal-anim">
                <button id="btn-close-dict" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 rounded-full p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                <div id="dict-content" class="mt-2 min-h-[100px] flex flex-col justify-center"></div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 1. Firebase 雲端設定區 (替換成你的金鑰)
        // ==========================================
        const firebaseConfig = {
		apiKey: "AIzaSyDwtMMyFRdrQm4YTwACi7-i2La9q1Ph4rg",
		authDomain: "githuben-e26eb.firebaseapp.com",
		projectId: "githuben-e26eb",
		storageBucket: "githuben-e26eb.firebasestorage.app",
		messagingSenderId: "686664343620",
		appId: "1:686664343620:web:15f245e8aca0d6323fdc11",
		measurementId: "G-QBVDWPWN8Y"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null; 

        // ==========================================
        // 2. 本地變數與資料庫 (讀取 1000 單字)
        // ==========================================
        const vocabularyDB = typeof externalVocabularyDB !== 'undefined' ? externalVocabularyDB : [
            { id: 1, en: 'error', kk: '', zh: '錯誤', example: 'Please ensure words_data.js is loaded.', exampleZh: '請確保單字庫檔案已正確載入。' }
        ];

        const SRS_INTERVALS = [0, 1, 3, 7, 14, 30]; 
        const MAX_LEVEL = 5;
        const NEW_WORDS_PER_DAY = 10; // 每天學習 10 個新單字

        let virtualCurrentDay = 0;
        let userProgress = {};
        let customWordsDB = [];
        let currentUnit = 1;
        let chartInstance = null;
        
        let sessionQueue = [];
        let mistakeQueue = [];
        let currentWord = null;
        let isShowingAnswer = false;
        let isMistakeMode = false;
        let isQuizMode = false;
        let sessionTitle = "一般課程";
        let totalCardsInSession = 0;
        let cardsCompleted = 0;

        // DOM 元素
        const viewDashboard = document.getElementById('view-dashboard');
        const viewStudy = document.getElementById('view-study');
        const viewCompleted = document.getElementById('view-completed');
        const flashcard = document.getElementById('flashcard');
        const actionShowAnswer = document.getElementById('action-show-answer');
        const actionRate = document.getElementById('action-rate');
        const quizOptions = document.getElementById('quiz-options');
        const actionNext = document.getElementById('action-next');
        
        // ==========================================
        // 3. 登入與雲端同步邏輯
        // ==========================================
        
        auth.onAuthStateChanged(async (user) => {
            const loginBtn = document.getElementById('btn-login');
            const userInfo = document.getElementById('user-info');
            const syncBanner = document.getElementById('sync-banner');
            const loadingBanner = document.getElementById('loading-banner');
            
            if (user) {
                currentUser = user;
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                syncBanner.classList.add('hidden');
                document.getElementById('user-avatar').src = user.photoURL;
                
                loadingBanner.classList.remove('hidden');
                await loadDataFromCloud();
                loadingBanner.classList.add('hidden');
            } else {
                currentUser = null;
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
                syncBanner.classList.remove('hidden');
                initLocalData();
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            auth.signInWithPopup(googleProvider).catch(error => {
                if(error.code === 'auth/invalid-api-key' || error.message.includes('API key')) {
                    alert('系統提示：請確認你是否已經貼上正確的 Firebase 金鑰！');
                } else if (error.code !== 'auth/popup-closed-by-user') {
                    console.error("登入失敗", error);
                    alert("登入發生錯誤：" + error.message);
                }
            });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            auth.signOut();
        });

        async function loadDataFromCloud() {
            try {
                const docRef = db.collection('users').doc(currentUser.uid);
                const docSnap = await docRef.get();
                
                if (docSnap.exists) {
                    const data = docSnap.data();
                    userProgress = data.progress || {};
                    virtualCurrentDay = data.day || 0;
                    customWordsDB = data.customWords || [];
                    
                    // 合併自訂單字到主要資料庫
                    customWordsDB.forEach(cw => {
                        vocabularyDB.push(cw);
                    });
                } else {
                    userProgress = {};
                    virtualCurrentDay = 0;
                }
                initAppLogic(); 
            } catch (error) {
                console.error("讀取雲端資料失敗:", error);
                alert("讀取雲端資料失敗，將使用本地暫存模式。");
                initLocalData();
            }
        }

        function saveToCloud() {
            if (!currentUser) return; 
            
            db.collection('users').doc(currentUser.uid).set({
                progress: userProgress,
                day: virtualCurrentDay,
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(error => {
                console.error("雲端存檔失敗:", error);
            });
        }

        // ==========================================
        // 4. 遊戲核心邏輯
        // ==========================================
        
        function initLocalData() {
            userProgress = {};
            virtualCurrentDay = 0;
            initAppLogic();
        }

        function initAppLogic() {
            updateDashboard();
        }

        document.getElementById('unit-selector').addEventListener('change', (e) => {
            currentUnit = parseInt(e.target.value);
            updateDashboard();
        });

        function updateDashboard() {
            document.getElementById('current-date-display').innerText = `虛擬時間: 第 ${virtualCurrentDay} 天`;

            let reviewCount = 0, masteredCount = 0, unitTotal = 0;
            let unlearnedWords = [];

            // 確保每個單字都有 unit 屬性 (如果沒有，每千字分一個單元)
            vocabularyDB.forEach(w => {
                if (!w.unit) w.unit = Math.ceil(w.id / 1000) || 1; 
                if (w.unit === currentUnit) unitTotal++;
            });

            // 計算複習與已掌握
            for (let id in userProgress) {
                const w = vocabularyDB.find(word => word.id == id);
                if (!w || w.unit !== currentUnit) continue; // 只算當前單元的

                const progress = userProgress[id];
                if (progress.level >= MAX_LEVEL) {
                    masteredCount++;
                } else if (progress.isLearning && progress.nextReviewDay <= virtualCurrentDay) {
                    reviewCount++;
                }
            }
            
            // 找新單字 (Lazy Initialization)
            for (let i = 0; i < vocabularyDB.length; i++) {
                const w = vocabularyDB[i];
                if (w.unit !== currentUnit) continue; // 只找當前單元的
                if (!userProgress[w.id] || !userProgress[w.id].isLearning) {
                    if (unlearnedWords.length < NEW_WORDS_PER_DAY) {
                        unlearnedWords.push(w.id);
                    } else {
                        break;
                    }
                }
            }

            const newCount = unlearnedWords.length;
            document.getElementById('stat-review').innerText = reviewCount;
            document.getElementById('stat-new').innerText = newCount;
            document.getElementById('stat-mastered').innerText = `${masteredCount} / ${unitTotal}`;

            renderChart(currentUnit);

            const startBtn = document.getElementById('btn-start-session');
            if (reviewCount === 0 && newCount === 0) {
                startBtn.innerText = "今日任務已完成，明天見！";
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                startBtn.innerText = `開始今日課程 (${reviewCount + newCount} 字)`;
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        document.getElementById('btn-start-session').addEventListener('click', () => {
            sessionTitle = "一般課程";
            sessionQueue = []; mistakeQueue = [];
            let unlearnedWords = [];

            // 找待複習單字
            for (let id in userProgress) {
                const w = vocabularyDB.find(word => word.id == id);
                if (!w || w.unit !== currentUnit) continue;

                const progress = userProgress[id];
                if (progress.isLearning && progress.level < MAX_LEVEL && progress.nextReviewDay <= virtualCurrentDay) {
                    sessionQueue.push(w);
                }
            }

            // 找新單字
            for (let i = 0; i < vocabularyDB.length; i++) {
                const w = vocabularyDB[i];
                if (w.unit !== currentUnit) continue;

                if (!userProgress[w.id] || !userProgress[w.id].isLearning) {
                    if (unlearnedWords.length < NEW_WORDS_PER_DAY) {
                        unlearnedWords.push(w);
                    } else {
                        break;
                    }
                }
            }

            sessionQueue = sessionQueue.concat(unlearnedWords);

            // 正式開始學習時，才將新單字加入 userProgress
            unlearnedWords.forEach(w => { 
                if (!userProgress[w.id]) {
                    userProgress[w.id] = { level: 0, nextReviewDay: 0, isLearning: true };
                } else {
                    userProgress[w.id].isLearning = true; 
                }
            });
            saveToCloud(); 

            // 打亂陣列
            for (let i = sessionQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sessionQueue[i], sessionQueue[j]] = [sessionQueue[j], sessionQueue[i]];
            }

            totalCardsInSession = sessionQueue.length;
            cardsCompleted = 0; isMistakeMode = false;

            viewDashboard.classList.add('hidden');
            viewStudy.classList.remove('hidden');
            nextCard();
        });

        function nextCard() {
            flashcard.classList.remove('flipped');
            actionShowAnswer.classList.add('hidden');
            actionRate.classList.add('hidden');
            quizOptions.classList.add('hidden');
            actionNext.classList.add('hidden');
            isShowingAnswer = false;

            if (sessionQueue.length > 0) {
                currentWord = sessionQueue.shift();
                document.getElementById('session-queue-type').innerText = sessionTitle;
            } else if (mistakeQueue.length > 0) {
                isMistakeMode = true;
                currentWord = mistakeQueue.shift();
                totalCardsInSession = cardsCompleted + mistakeQueue.length + 1;
                document.getElementById('session-queue-type').innerText = "當次錯題強制複習";
            } else {
                finishSession();
                return;
            }

            document.getElementById('card-word').innerText = currentWord.en;
            document.getElementById('card-word-back').innerText = currentWord.en;
            document.getElementById('card-translation').innerText = currentWord.zh;
            
            // 決定模式：等級 0 (新單字) 用翻卡片，等級 > 0 (複習) 用 4 選 1
            const progress = userProgress[currentWord.id];
            isQuizMode = progress && progress.level > 0;
            
            if (isQuizMode) {
                quizOptions.classList.remove('hidden');
                setupQuizMode();
            } else {
                actionShowAnswer.classList.remove('hidden');
            }

            document.getElementById('card-kk').innerText = '...';
            document.getElementById('card-kk-back').innerText = '...';

            if (currentWord.kk) {
                document.getElementById('card-kk').innerText = currentWord.kk;
                document.getElementById('card-kk-back').innerText = currentWord.kk;
            } else {
                document.getElementById('card-kk').innerText = '';
                document.getElementById('card-kk-back').innerText = '';
            }

            // 處理例句顯示 (如果有才顯示，沒有則非同步去抓)
            const exampleContainer = document.getElementById('example-container');
            const cardExample = document.getElementById('card-example');
            const cardExampleZh = document.getElementById('card-example-zh');
            
            if (currentWord.example) {
                exampleContainer.classList.remove('hidden');
                cardExample.innerHTML = renderClickableSentence(currentWord.example);
                cardExampleZh.innerText = currentWord.exampleZh || '';
            } else {
                exampleContainer.classList.add('hidden');
                
                // 動態抓取例句並翻譯
                fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${currentWord.en}`)
                    .then(res => res.ok ? res.json() : Promise.reject())
                    .then(data => {
                        // 順便補音標(如果原本沒有)
                        if (!currentWord.kk) {
                            let phonetic = data[0]?.phonetic || '';
                            if (!phonetic && data[0]?.phonetics?.length > 0) {
                                const p = data[0].phonetics.find(p => p.text);
                                if (p) phonetic = p.text;
                            }
                            if (phonetic) {
                                currentWord.kk = phonetic;
                                document.getElementById('card-kk').innerText = phonetic;
                                document.getElementById('card-kk-back').innerText = phonetic;
                            }
                        }

                        // 找第一句例句
                        let foundExample = '';
                        for (const meaning of data[0]?.meanings || []) {
                            for (const def of meaning.definitions || []) {
                                if (def.example) {
                                    foundExample = def.example;
                                    break;
                                }
                            }
                            if (foundExample) break;
                        }

                        if (foundExample) {
                            currentWord.example = foundExample;
                            exampleContainer.classList.remove('hidden');
                            cardExample.innerHTML = renderClickableSentence(foundExample);
                            cardExampleZh.innerText = '翻譯中...';
                            
                            // 呼叫 Google 翻譯 API 轉中文
                            return fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(foundExample)}`);
                        }
                    })
                    .then(res => res ? res.json() : null)
                    .then(transData => {
                        if (transData && transData[0]) {
                            const translated = transData[0].map(x => x[0]).join('');
                            currentWord.exampleZh = translated;
                            cardExampleZh.innerText = translated;
                        }
                    })
                    .catch(() => {
                        // 找不到例句就不顯示
                    });
            }

            updateProgressBar();
            playAudio(currentWord.en);
        }

        function handleAnswer(isCorrect) {
            const wordId = currentWord.id;
            let progress = userProgress[wordId];

            if (isMistakeMode) {
                if (isCorrect) {
                    cardsCompleted++;
                    progress.level = 1;
                    progress.nextReviewDay = virtualCurrentDay + SRS_INTERVALS[progress.level];
                } else {
                    mistakeQueue.push(currentWord);
                }
            } else {
                cardsCompleted++;
                if (isCorrect) {
                    progress.level = Math.min(progress.level + 1, MAX_LEVEL);
                    progress.nextReviewDay = virtualCurrentDay + SRS_INTERVALS[progress.level];
                } else {
                    progress.level = Math.max(0, progress.level - 1); // 答錯只降一級，降低挫折感
                    progress.nextReviewDay = virtualCurrentDay;
                    progress.lastMistakeDay = virtualCurrentDay; // 記錄錯題發生日
                    mistakeQueue.push(currentWord);
                }
            }
            
            saveToCloud(); 
        }

        function setupQuizMode() {
            // 挑選 3 個隨機錯誤答案
            let options = [currentWord];
            let attempts = 0;
            while(options.length < 4 && attempts < 100) {
                const randWord = vocabularyDB[Math.floor(Math.random() * vocabularyDB.length)];
                if (!options.find(o => o.zh === randWord.zh)) {
                    options.push(randWord);
                }
                attempts++;
            }
            
            // 打亂選項
            options.sort(() => Math.random() - 0.5);
            
            quizOptions.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-action w-full bg-white hover:bg-gray-50 border-2 border-gray-200 text-gray-800 font-bold py-3 px-4 rounded-xl shadow-sm text-left text-lg transition-colors';
                btn.innerText = opt.zh;
                
                btn.onclick = () => {
                    if (isShowingAnswer) return; // 已經回答過
                    isShowingAnswer = true;
                    
                    const isCorrect = opt.id === currentWord.id;
                    
                    // 標示顏色
                    Array.from(quizOptions.children).forEach(b => {
                        b.disabled = true;
                        if (b.innerText === currentWord.zh) {
                            b.classList.remove('bg-white', 'border-gray-200');
                            b.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                        } else if (b === btn && !isCorrect) {
                            b.classList.remove('bg-white', 'border-gray-200');
                            b.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                        }
                    });
                    
                    handleAnswer(isCorrect);
                    
                    // 自動翻到背面看例句
                    setTimeout(() => {
                        flashcard.classList.add('flipped');
                        actionNext.classList.remove('hidden'); // 顯示下一題按鈕
                    }, 500);
                };
                
                quizOptions.appendChild(btn);
            });
        }

        function updateProgressBar() {
            const percentage = (cardsCompleted / totalCardsInSession) * 100;
            document.getElementById('session-progress-bar').style.width = `${percentage}%`;
            document.getElementById('session-progress-text').innerText = `進度: ${cardsCompleted} / ${totalCardsInSession}`;
        }

        function finishSession() {
            viewStudy.classList.add('hidden');
            viewCompleted.classList.remove('hidden');
        }

        document.getElementById('btn-return-dash').addEventListener('click', () => {
            viewCompleted.classList.add('hidden');
            viewDashboard.classList.remove('hidden');
            updateDashboard();
        });

        document.getElementById('btn-show-answer').addEventListener('click', () => {
            if (isShowingAnswer) return;
            isShowingAnswer = true;
            flashcard.classList.add('flipped');
            actionShowAnswer.classList.add('hidden');
            actionRate.classList.remove('hidden');
        });

        document.getElementById('btn-rate-wrong').addEventListener('click', () => { handleAnswer(false); nextCard(); });
        document.getElementById('btn-rate-right').addEventListener('click', () => { handleAnswer(true); nextCard(); });
        
        document.getElementById('btn-next-card').addEventListener('click', () => nextCard());

        flashcard.addEventListener('click', (e) => {
            if (!isQuizMode && !isShowingAnswer && !e.target.closest('button') && !e.target.closest('.dict-word')) {
                document.getElementById('btn-show-answer').click();
            }
        });

        document.getElementById('dev-next-day-btn').addEventListener('click', () => {
            virtualCurrentDay++;
            saveToCloud(); 
            updateDashboard();
            if (!viewCompleted.classList.contains('hidden')) {
                document.getElementById('btn-return-dash').click();
            }
        });

        // ==========================================
        // 5. 語音與字典功能 
        // ==========================================
        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        document.getElementById('btn-audio').addEventListener('click', () => playAudio(currentWord.en));
        document.getElementById('btn-example-audio').addEventListener('click', () => {
            if (currentWord && currentWord.example) playAudio(currentWord.example);
        });

        // 使用事件代理處理例句點擊
        document.getElementById('card-example').addEventListener('click', (e) => {
            const wordSpan = e.target.closest('.dict-word');
            if (wordSpan) {
                e.stopPropagation();
                lookupWord(wordSpan.getAttribute('data-word'));
            }
        });

        function renderClickableSentence(sentence) {
            if (!sentence) return '';
            return sentence.replace(/\b([a-zA-Z]+(?:'[a-zA-Z]+)?)\b/g, (match) => {
                const cleanWord = match.toLowerCase().replace(/['".,!?]/g, ''); 
                return `<span class="dict-word cursor-pointer text-indigo-600 border-b border-dashed border-indigo-300 hover:bg-indigo-100 transition-colors" data-word="${cleanWord}">${match}</span>`;
            });
        }

        async function lookupWord(word) {
            const modal = document.getElementById('dict-modal');
            const content = document.getElementById('dict-content');
            modal.classList.remove('hidden');
            content.innerHTML = `<div class="flex justify-center py-4"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div></div>`;
            
            // 1. 先查本地單字庫 (瞬間完成)
            const localWord = vocabularyDB.find(w => w.en.toLowerCase() === word.toLowerCase());
            
            if (localWord) {
                renderDictModal(word, localWord.kk || '', '內建 7000 單字庫', localWord.zh);
                return;
            }

            // 2. 本地查不到，改用 Google Translate API
            try {
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(word)}`);
                if (!response.ok) throw new Error('Not found');
                const data = await response.json();
                
                const translated = data[0].map(x => x[0]).join('');
                renderDictModal(word, '', 'Google 翻譯', translated);
            } catch (e) {
                renderDictErrorModal(word);
            }
        }

        function renderDictModal(word, phonetic, pos, def) {
            const content = document.getElementById('dict-content');
            content.innerHTML = `
                <h3 class="text-2xl font-bold text-gray-800">${word}</h3>
                <div class="flex items-center gap-2 mb-3 mt-1">
                    ${phonetic ? `<span class="text-gray-500 font-mono">${phonetic}</span>` : ''}
                    <button id="btn-dict-audio" class="text-indigo-500 hover:text-indigo-700 p-1">
                        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
                <span class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2 py-1 rounded font-semibold mb-2">${pos}</span>
                <p class="text-gray-700 text-lg font-bold leading-relaxed mb-4">${def}</p>
                <div class="flex flex-col gap-2">
                    <a href="https://tw.dictionary.search.yahoo.com/search?p=${word}" target="_blank" class="text-center bg-purple-50 text-purple-700 hover:bg-purple-100 font-semibold py-2 rounded-lg text-sm border border-purple-200">在 Yahoo 字典查看</a>
                    <a href="https://translate.google.com/?sl=en&tl=zh-TW&text=${word}&op=translate" target="_blank" class="text-center bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold py-2 rounded-lg text-sm border border-indigo-200">使用 Google 翻譯</a>
                    <button id="btn-add-custom-word" class="text-center bg-green-50 text-green-700 hover:bg-green-100 font-bold py-2 rounded-lg text-sm border border-green-200 transition-colors shadow-sm">
                        ➕ 將此單字加入「自訂字庫」
                    </button>
                </div>
            `;
            document.getElementById('btn-dict-audio').addEventListener('click', () => playAudio(word));
            const btnAdd = document.getElementById('btn-add-custom-word');
            if (btnAdd) {
                btnAdd.addEventListener('click', () => {
                    const success = addCustomWord(word, phonetic, def);
                    if (success) {
                        btnAdd.innerText = '✅ 已加入單元 10';
                        btnAdd.disabled = true;
                        btnAdd.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                });
            }
        }

        function renderDictErrorModal(word) {
            const content = document.getElementById('dict-content');
            content.innerHTML = `
                <h3 class="text-xl font-bold text-gray-800">${word}</h3>
                <div class="flex items-center gap-2 mb-3 mt-1">
                    <button id="btn-dict-audio" class="text-indigo-500 hover:text-indigo-700 flex items-center gap-1 text-sm bg-indigo-50 rounded-full px-3 py-1">
                        聆聽發音
                    </button>
                </div>
                <p class="text-gray-500 text-sm mt-2 mb-4">無法取得翻譯，但你仍可將它加入自訂字庫。</p>
                <div class="flex flex-col gap-2">
                    <a href="https://tw.dictionary.search.yahoo.com/search?p=${word}" target="_blank" class="text-center bg-purple-50 text-purple-700 hover:bg-purple-100 font-semibold py-2 rounded-lg text-sm border border-purple-200">在 Yahoo 字典查看</a>
                    <a href="https://translate.google.com/?sl=en&tl=zh-TW&text=${word}&op=translate" target="_blank" class="text-center bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold py-2 rounded-lg text-sm border border-indigo-200">使用 Google 翻譯</a>
                    <button id="btn-add-custom-error" class="text-center bg-green-50 text-green-700 hover:bg-green-100 font-bold py-2 rounded-lg text-sm border border-green-200 transition-colors shadow-sm">
                        ➕ 將此單字加入「自訂字庫」
                    </button>
                </div>
            `;
            document.getElementById('btn-dict-audio').addEventListener('click', () => playAudio(word));
            
            const btnAdd = document.getElementById('btn-add-custom-error');
            if (btnAdd) {
                btnAdd.addEventListener('click', () => {
                    const success = addCustomWord(word, '', '請自行查閱');
                    if (success) {
                        btnAdd.innerText = '✅ 已加入單元 10';
                        btnAdd.disabled = true;
                        btnAdd.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                });
            }
        }

        document.getElementById('btn-close-dict').addEventListener('click', () => {
            document.getElementById('dict-modal').classList.add('hidden');
        });
        document.getElementById('dict-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('dict-modal')) e.target.classList.add('hidden');
        });

        // 繪製熟悉度分佈圖 (Chart.js)
        function renderChart(unit) {
            const ctx = document.getElementById('masteryChart');
            if (!ctx) return;
            
            let levels = [0, 0, 0, 0, 0, 0]; // Level 0 to 5
            for (let id in userProgress) {
                const w = vocabularyDB.find(word => word.id == id);
                if (w && w.unit === unit && userProgress[id].isLearning) {
                    levels[userProgress[id].level] = (levels[userProgress[id].level] || 0) + 1;
                }
            }

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['未熟', '等級 1', '等級 2', '等級 3', '等級 4', '精熟'],
                    datasets: [{
                        label: '單字數量',
                        data: levels,
                        backgroundColor: [
                            '#fee2e2', '#ffedd5', '#fef3c7', '#dcfce7', '#e0e7ff', '#c7d2fe'
                        ],
                        borderColor: [
                            '#ef4444', '#f97316', '#eab308', '#22c55e', '#6366f1', '#4f46e5'
                        ],
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        // 加入自訂單字
        function addCustomWord(en, kk, zh) {
            if (!currentUser) {
                alert('請先登入才能使用自訂字庫！');
                return false;
            }
            
            // 檢查是否已經在「自訂字庫 (單元 10)」裡面了
            if (customWordsDB.find(w => w.en.toLowerCase() === en.toLowerCase())) {
                alert('這個單字已經在你的自訂字庫裡囉！');
                return false;
            }

            const newWord = {
                id: 10000 + Date.now(), // 用時間戳確保 ID 唯一
                en: en,
                kk: kk,
                zh: zh,
                unit: 10 // 自訂字庫專屬單元
            };

            customWordsDB.push(newWord);
            vocabularyDB.push(newWord);

            db.collection('users').doc(currentUser.uid).set({
                customWords: customWordsDB
            }, { merge: true }).catch(console.error);
            
            // 如果剛好在單元 10，更新畫面
            if (currentUnit === 10) updateDashboard();
            
            return true;
        }

        // 錯題加強複習
        function startMistakeReview(daysRange) {
            sessionQueue = []; mistakeQueue = [];
            for (let id in userProgress) {
                const progress = userProgress[id];
                if (progress.lastMistakeDay !== undefined && virtualCurrentDay - progress.lastMistakeDay <= daysRange) {
                    const w = vocabularyDB.find(word => word.id == id);
                    if (w && w.unit === currentUnit) sessionQueue.push(w); // 只複習該單元的錯字
                }
            }

            if (sessionQueue.length === 0) {
                alert('太棒了！這段期間內本單元沒有任何錯題紀錄。');
                return;
            }

            // 打亂
            for (let i = sessionQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sessionQueue[i], sessionQueue[j]] = [sessionQueue[j], sessionQueue[i]];
            }

            totalCardsInSession = sessionQueue.length;
            cardsCompleted = 0; isMistakeMode = false;
            sessionTitle = `錯題特訓 (${sessionQueue.length} 字)`;

            viewDashboard.classList.add('hidden');
            viewStudy.classList.remove('hidden');
            nextCard();
        }

        document.getElementById('btn-review-week').addEventListener('click', () => startMistakeReview(7));
        document.getElementById('btn-review-month').addEventListener('click', () => startMistakeReview(30));
        document.getElementById('btn-review-all').addEventListener('click', () => startMistakeReview(99999));

    </script>
</body>
